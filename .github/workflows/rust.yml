name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Immutable LXMF-rs v0.13.0 release commit (scoped Reticulum 1.5.5 update).
  LXMF_RS_REF: fbc75b86e15550722923b366398f0a4116182894

jobs:
  web:
    name: Web / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [source-size, typecheck, source-size-tests, app-unit, node-client-tests, node-client-build, web-build, mobile-build]

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rem/package-lock.json

      - name: Install npm dependencies
        working-directory: rem
        run: npm ci

      - name: Run independent web check
        working-directory: rem
        env:
          WEB_CHECK: ${{ matrix.check }}
        run: |
          case "$WEB_CHECK" in
            source-size) npm run check:source-size ;;
            typecheck) npm --workspace apps/mobile run typecheck ;;
            source-size-tests) npm run test:source-size ;;
            app-unit) npm run test:app-unit ;;
            node-client-tests) npm run test:node-client ;;
            node-client-build) npm run node-client:build ;;
            web-build) npm run web:build ;;
            mobile-build) npm run mobile:build ;;
            *) exit 1 ;;
          esac

  npm-security:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rem
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rem/package-lock.json
      - name: Install locked dependencies
        working-directory: rem
        run: npm ci
      - name: Audit npm dependencies
        working-directory: rem
        run: npm audit --audit-level=moderate

  e2e:
    name: Playwright Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rem/package-lock.json

      - name: Install npm dependencies
        working-directory: rem
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: rem
        run: npx playwright install --with-deps chromium

      - name: Run complete Playwright matrix
        working-directory: rem
        env:
          CHOKIDAR_USEPOLLING: "1"
        run: npm run test:e2e
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-playwright-${{ github.sha }}
          path: |
            rem/playwright-report/
            rem/test-results/

  rust:
    name: Rust / ${{ matrix.check }} (pinned LXMF)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, tests, audit]

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Check out LXMF-rs
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: ${{ env.LXMF_RS_REF }}

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Check locked Rust dependencies
        working-directory: rem
        run: cargo fetch --manifest-path crates/reticulum_mobile/Cargo.toml --locked

      - name: Install cargo-audit
        if: matrix.check == 'audit'
        run: cargo install cargo-audit --locked

      - name: Run independent Rust check
        working-directory: rem
        env:
          RUST_CHECK: ${{ matrix.check }}
        run: |
          case "$RUST_CHECK" in
            fmt)
              cargo fmt --manifest-path crates/reticulum_mobile/Cargo.toml -- --check
              cargo fmt --manifest-path crates/reticulum_mobile/jni-boundary-macro/Cargo.toml --all -- --check
              ;;
            clippy)
              cargo clippy --manifest-path crates/reticulum_mobile/Cargo.toml --locked --all-targets -- -D warnings
              cargo clippy --manifest-path crates/reticulum_mobile/jni-boundary-macro/Cargo.toml --all-targets -- -D warnings
              ;;
            tests) cargo test --manifest-path crates/reticulum_mobile/Cargo.toml --locked --verbose ;;
            audit) cargo audit --file crates/reticulum_mobile/Cargo.lock ;;
            *) exit 1 ;;
          esac

  rust-current-lxmf:
    name: Rust / ${{ matrix.check }} (current LXMF main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, tests]

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Check out current LXMF-rs main
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: main

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Generate ephemeral lockfile for current LXMF
        working-directory: rem
        run: cargo generate-lockfile --manifest-path crates/reticulum_mobile/Cargo.toml

      - name: Fetch current Rust dependencies
        working-directory: rem
        run: cargo fetch --manifest-path crates/reticulum_mobile/Cargo.toml

      - name: Run independent current-main compatibility check
        working-directory: rem
        env:
          COMPATIBILITY_CHECK: ${{ matrix.check }}
        run: |
          case "$COMPATIBILITY_CHECK" in
            clippy)
              cargo clippy --manifest-path crates/reticulum_mobile/Cargo.toml --locked --all-targets -- -D warnings
              cargo clippy --manifest-path crates/reticulum_mobile/jni-boundary-macro/Cargo.toml --all-targets -- -D warnings
              ;;
            tests) cargo test --manifest-path crates/reticulum_mobile/Cargo.toml --locked --verbose ;;
            *) exit 1 ;;
          esac
