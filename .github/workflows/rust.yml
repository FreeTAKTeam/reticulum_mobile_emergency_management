name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # LXMF-rs v0.9.5
  LXMF_RS_REF: 7cafc5b4be21ff4f777d0f2300cfb79e5d0da23c

jobs:
  web:
    name: Web and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rem/package-lock.json

      - name: Install npm dependencies
        working-directory: rem
        run: npm ci

      - name: Enforce first-party source size
        working-directory: rem
        run: npm run check:source-size

      - name: Build node client
        working-directory: rem
        run: npm run node-client:build

      - name: Run app unit tests
        working-directory: rem
        run: npm run test:unit

      - name: Typecheck mobile app
        working-directory: rem
        run: npm --workspace apps/mobile run typecheck

      - name: Build web app
        working-directory: rem
        run: npm run web:build

  e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rem/package-lock.json

      - name: Install npm dependencies
        working-directory: rem
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: rem
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: rem
        env:
          CHOKIDAR_USEPOLLING: "1"
        run: npm run test:e2e -- e2e/android-back-navigation.spec.ts

  rust:
    name: Rust Runtime (pinned LXMF)
    runs-on: ubuntu-latest

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Check out LXMF-rs
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: ${{ env.LXMF_RS_REF }}

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Check locked Rust dependencies
        working-directory: rem
        run: cargo fetch --manifest-path crates/reticulum_mobile/Cargo.toml --locked

      - name: Check Rust formatting
        working-directory: rem
        run: cargo fmt --manifest-path crates/reticulum_mobile/Cargo.toml --all -- --check

      - name: Run clippy
        working-directory: rem
        run: cargo clippy --manifest-path crates/reticulum_mobile/Cargo.toml --all-targets

      - name: Run Rust tests
        working-directory: rem
        run: cargo test --manifest-path crates/reticulum_mobile/Cargo.toml --verbose

  rust-current-lxmf:
    name: Rust Runtime (current LXMF main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out mobile app
        uses: actions/checkout@v6
        with:
          path: rem

      - name: Check out current LXMF-rs main
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: main

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Check locked Rust dependencies
        working-directory: rem
        run: cargo fetch --manifest-path crates/reticulum_mobile/Cargo.toml --locked

      - name: Check Rust formatting
        working-directory: rem
        run: cargo fmt --manifest-path crates/reticulum_mobile/Cargo.toml --all -- --check

      - name: Run clippy
        working-directory: rem
        run: cargo clippy --manifest-path crates/reticulum_mobile/Cargo.toml --all-targets

      - name: Run Rust tests
        working-directory: rem
        run: cargo test --manifest-path crates/reticulum_mobile/Cargo.toml --verbose
