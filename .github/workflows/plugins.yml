name: Plugins

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # Immutable LXMF-rs single-owner read and RNode queue-admission repair revision.
  LXMF_RS_REF: a30657b67f35f81a95f04358837963c6766e9e7a

jobs:
  plugin-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rem
      - uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: ${{ env.LXMF_RS_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rem/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: Install dependencies
        working-directory: rem
        run: npm ci
      - name: Check Rust formatting
        working-directory: rem
        run: cargo fmt --manifest-path crates/reticulum_mobile/Cargo.toml --all -- --check
      - name: Test plugin Rust core
        working-directory: rem
        run: cargo test --manifest-path crates/reticulum_mobile/Cargo.toml plugin_ --no-fail-fast
      - name: Build node client
        working-directory: rem
        run: npm --workspace packages/node-client run build
      - name: Typecheck mobile UI
        working-directory: rem
        run: npm --workspace apps/mobile run typecheck
      - name: Build web and mobile UI
        working-directory: rem
        run: npm run web:build && npm run mobile:build
      - name: Install Playwright Chromium
        working-directory: rem
        run: npx playwright install --with-deps chromium
      - name: Test plugin management UI
        working-directory: rem
        env:
          CHOKIDAR_USEPOLLING: "1"
        run: npx playwright test e2e/settings.spec.ts --grep "plugin management"
      - name: Synchronize Capacitor Android project
        working-directory: rem/apps/mobile
        run: npx cap sync android
      - name: Build x86_64 native bridge for emulator
        working-directory: rem
        run: |
          rustup target add x86_64-linux-android
          NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          NDK_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/x86_64-linux-android21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android21-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android21-clang"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_x86_64_linux_android="$NDK_BIN/llvm-ranlib"
          cargo build --manifest-path crates/reticulum_mobile/Cargo.toml --release --target x86_64-linux-android
          mkdir -p apps/mobile/android/app/src/main/jniLibs/x86_64
          cp crates/reticulum_mobile/target/x86_64-linux-android/release/libreticulum_mobile.so apps/mobile/android/app/src/main/jniLibs/x86_64/
      - name: Build REM, SDK, and plugin APKs
        working-directory: rem/apps/mobile/android
        run: |
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -name apksigner \
            | sort -V | tail -n 1)"
          echo "Using apksigner: $APKSIGNER"
          test -x "$APKSIGNER"
          SIGNER_REPORT="$("$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$SIGNER_REPORT"
          REM_DEBUG_FINGERPRINT="$(printf '%s\n' "$SIGNER_REPORT" \
            | awk '/certificate SHA-256 digest:/{print $NF; exit}')"
          [[ "$REM_DEBUG_FINGERPRINT" =~ ^[0-9A-Fa-f]{64}$ ]]
          bash ./gradlew -PremHostFingerprints="$REM_DEBUG_FINGERPRINT" \
            :rem-plugin-sdk:assembleDebug \
            :rem-plugin-sdk:testDebugUnitTest \
            :plugin-test-fixture:assembleDebug \
            :ble-heart-rate-plugin:testDebugUnitTest \
            :ble-heart-rate-plugin:assembleDebug \
            :watch-status-plugin:testDebugUnitTest \
            :watch-status-plugin:assembleDebug
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm || true
      - name: Exercise plugin discovery and Binder integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r rem/apps/mobile/android/plugin-test-fixture/build/outputs/apk/debug/plugin-test-fixture-debug.apk
            adb install -r rem/plugins/watch-status/android/build/outputs/apk/debug/watch-status-plugin-debug.apk
            bash rem/apps/mobile/android/gradlew -p rem/apps/mobile/android :app:installDebug :app:installDebugAndroidTest
            adb logcat -c
            adb shell am instrument -w -r -e class network.reticulum.emergency.plugins.PluginBinderIntegrationTest network.reticulum.emergency.test/androidx.test.runner.AndroidJUnitRunner || { adb logcat -d '*:E'; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: rem-plugin-sdk
          path: |
            rem/packages/android-plugin-sdk/build/outputs/aar/rem-plugin-sdk-debug.aar
            rem/packages/android-plugin-sdk/README.md
            rem/docs/plugins/android-plugin-system.md
      - uses: actions/upload-artifact@v7
        with:
          name: rem-plugin-test-fixture
          path: rem/apps/mobile/android/plugin-test-fixture/build/outputs/apk/debug/plugin-test-fixture-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: rem-ble-heart-rate-plugin
          path: rem/plugins/ble-heart-rate/android/build/outputs/apk/debug/ble-heart-rate-plugin-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: rem-watch-status-plugin
          path: rem/plugins/watch-status/android/build/outputs/apk/debug/watch-status-plugin-debug.apk
