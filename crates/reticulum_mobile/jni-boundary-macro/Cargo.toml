[package]
name = "reticulum-mobile-jni-boundary"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
