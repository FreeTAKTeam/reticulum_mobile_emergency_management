[package]
name = "reticulum_mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lints.rust]
# UniFFI/JNI require unmangled exports; first-party implementation modules deny unsafe in lib.rs.
unsafe_code = "warn"

[lints.clippy]
all = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
unchecked_duration_subtraction = "warn"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reticulum-mobile-jni-boundary = { path = "jni-boundary-macro" }
reticulum = { package = "reticulum-rs", path = "../../../LXMF-rs/crates/libs/reticulum-rs" }
base64 = "0.22"
crossbeam-channel = "0.5"
csv = "1.3"
fs-err = "2.11.0"
flate2 = "1"
hex = "0.4"
jni = "0.21"
log = "0.4"
lxmf = { package = "lxmf-wire", path = "../../../LXMF-rs/crates/libs/lxmf-core", default-features = false, features = ["std"] }
lxmf-sdk = { path = "../../../LXMF-rs/crates/libs/lxmf-sdk", default-features = false, features = ["std"] }
lxmf-runtime = { path = "../../../LXMF-rs/crates/libs/lxmf-runtime" }
rmp-serde = "1"
rmpv = "1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1.44.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uniffi = "0.28"
x25519-dalek = "2.0.1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
rns-transport = { package = "reticulum-rs-transport", path = "../../../LXMF-rs/crates/libs/rns-transport" }
